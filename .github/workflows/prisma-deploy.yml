# Deploys this app to Prisma Cloud. Runs only when started by hand.
#
# The site is served by Vercel and its database is Supabase (DATABASE.md,
# "Using Supabase"), so nothing depends on this workflow. It used to run on
# every push to `main` and fail there. It is kept so that a Prisma Cloud
# deploy can still be started from the Actions tab: choose "prisma-deploy",
# "Run workflow", branch `main`. Database changes reach Supabase through
# database-migrate.yml instead.
#
# What it deploys is declared in module.ts (see PRISMA_SETUP.md, "Deploying"):
# the `production` environment of the Prisma project "hyper-social-connection-".
#
# Credentials, in the order the action tries them:
#
#   1. The repository secret PRISMA_SERVICE_TOKEN, when it is set. A service
#      token can create the Prisma project, so the first deploy needs it.
#   2. Otherwise a 30-minute token Prisma issues to this repository because it
#      is connected in the Prisma Console (`id-token: write` below). That token
#      can deploy into a project that exists but cannot create one.
#
# With neither, the job finishes green and reports "deploy skipped, no
# credential".
name: prisma-deploy

on:
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy
# instead of cancelling it: a deploy stopped halfway can leave a migration
# partly applied.
concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # A run started by hand from another branch would deploy a preview
    # environment; only `main` is deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The action runs the Prisma CLI with Bun.
      - uses: oven-sh/setup-bun@v2
      # Runs `npm ci`, then the build command, then `prisma deploy`.
      - uses: prisma/cloud-deploy-action@v1
        with:
          build-command: npm run build
          module: module.ts
        env:
          # Empty when the secret is not set; the action then uses the
          # token issued to the connected repository.
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
