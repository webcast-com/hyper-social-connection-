# Deploys this app to Prisma Cloud when `main` changes.
#
# A push to `main` deploys the `production` environment of the Prisma project
# "hyper-social-connection-". Other branches are not deployed. To give every
# branch its own preview environment (its own service and its own empty
# database), remove the `branches` filter below.
#
# What it deploys is declared in module.ts (see PRISMA_SETUP.md, "Deploying").
#
# No secret is needed once the repository is connected in the Prisma Console:
# the job proves which repository it is to Prisma with a GitHub-issued token
# (`id-token: write` below) and receives a deploy token that lasts 30 minutes.
# Until the repository is connected the job finishes green and reports
# "deploy skipped, no credential" rather than failing.
name: prisma-deploy

on:
  push:
    branches: [main]

# One deploy at a time. A newer push waits for the running deploy
# instead of cancelling it: a deploy stopped halfway can leave a migration
# partly applied.
concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The action runs the Prisma CLI with Bun.
      - uses: oven-sh/setup-bun@v2
      # Runs `npm ci`, then the build command, then `prisma deploy`.
      - uses: prisma/cloud-deploy-action@v1
        with:
          build-command: npm run build
          module: module.ts
