# Copies the site's data (accounts, posts, messages, …) from its previous
# database into the Supabase database. Runs only when started by hand:
# Actions → "database-copy" → "Run workflow" on `main`, and pick a mode.
#
#   check    Compare the two databases and report, table by table, how many
#            rows each holds and whether anything stands in the way of a copy.
#            Copies nothing. Start with this one.
#   copy     Copy everything into the Supabase database. Refuses if it already
#            holds rows.
#   replace  Delete the rows the Supabase database holds, then copy. For a
#            second run just before switching the site over, so that what was
#            posted since the first copy comes along.
#
# In every mode the Supabase database's tables are created first if they are
# missing (the same steps as database-migrate.yml); that touches no data.
#
# The previous database is only read. The copy is all-or-nothing: if any step
# fails, the Supabase database is left exactly as it was. See
# scripts/copy-database.ts and DATABASE.md, "Moving existing data".
#
# Repository secrets (Settings → Secrets and variables → Actions):
#
#   SUPABASE_DATABASE_URL  Where the data goes: the Supabase "Session pooler"
#                          connection string (port 5432). Required.
#   SUPABASE_CA_CERT       Optional, as in database-migrate.yml.
#   SOURCE_DATABASE_URL    Where the data is now: the DATABASE_URL the live
#                          site uses today (Vercel → Settings → Environment
#                          Variables). When this secret is not set, the
#                          DATABASE_URL in the repository's .env.local / .env
#                          is used; the run prints which database that is.
name: database-copy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = compare only; copy = into an empty database; replace = delete what is there, then copy"
        type: choice
        options: [check, copy, replace]
        default: check
        required: true

# Never at the same time as a migration, and never cancelled halfway.
concurrency:
  group: database-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
    steps:
      - name: Check for the connection string
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "::error::The repository secret SUPABASE_DATABASE_URL is not set. Add it, then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The three steps below create and check the tables. Each names the
      # Supabase database explicitly so that none can fall back to the
      # database in the repository's .env files.
      - name: Create the tables if they are missing
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: |
          npm run db:migrate
          npm run db:bootstrap
      - name: Compare or copy (mode ${{ inputs.mode }})
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          TARGET_DATABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          npm run --silent db:copy -- "$MODE" 2>&1 | tee copy-report.txt
      - name: Report
        if: always()
        run: |
          if [ -f copy-report.txt ]; then
            { echo '```'; cat copy-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Close the Supabase Data API to the tables
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: npm run db:lockdown
      - name: Check the database against the schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: npm run db:check
